# Deploy config for the course-managed Fly.io setup. The machine, volume and
# auto-stop settings are the shape the course watches — leave them as they are.
# There's no `app` line: the app is named after this repo, and the deploy
# command passes it. While the repo is private you deploy by hand from here,
# with the token the course sent you sitting in mise.local.toml:
#
#   flyctl deploy --remote-only --ha=false -a <this-repo-name>
#
# (remote build on Fly's builders; one machine, one volume). Once you ship the
# repo public, CI runs the same command on every push to main.

primary_region = "syd"

[build]
dockerfile = "Dockerfile"

[env]
# the SQLite file lives on the volume, so state survives reloads, restarts,
# and redeploys
DATABASE_PATH = "/data/app.db"

[http_service]
internal_port = 4321
force_https = true
# the machine stops when nobody's using it and starts on the next request —
# this is most of why the app costs cents, not dollars
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

# Without this block Fly's only health signal is "is the port open", which a
# broken migration passes: migrate() throws lazily on the first request that
# imports src/lib/db.ts, so the process still binds the port and every page
# just 500s underneath a "healthy" machine. "/" is the deliberate choice of
# path — it's the page that reads from the database (currently via
# listMessages(), soon via the courses/assessments tables), so a migration
# failure fails THIS check rather than hiding behind a route that never
# touches the DB.
[[http_service.checks]]
grace_period = "10s"
interval = "15s"
timeout = "5s"
method = "GET"
path = "/"
protocol = "http"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"

[mounts]
source = "data"
destination = "/data"
initial_size = "1gb"
